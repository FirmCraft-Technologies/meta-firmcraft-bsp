# BeagleBone Black Advanced Kernel Configuration Fragment
# This fragment enables advanced features for industrial and embedded use

# ===== Real-Time Features =====
CONFIG_PREEMPT=y
CONFIG_PREEMPT_COUNT=y
CONFIG_HIGH_RES_TIMERS=y

# ===== Industrial I/O Support =====
CONFIG_IIO=m
CONFIG_IIO_BUFFER=y
CONFIG_IIO_TRIGGERED_BUFFER=m
CONFIG_IIO_KFIFO_BUF=m
CONFIG_TI_ADC081C=m
CONFIG_TI_ADS1015=m
CONFIG_TI_ADS7950=m
CONFIG_TI_AM335X_ADC=m

# ===== CAN Bus Support =====
CONFIG_CAN=m
CONFIG_CAN_RAW=m
CONFIG_CAN_BCM=m
CONFIG_CAN_GW=m
CONFIG_CAN_C_CAN=m
CONFIG_CAN_C_CAN_PLATFORM=m

# ===== I2C Support =====
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=m
CONFIG_I2C_MUX=m
CONFIG_I2C_MUX_PCA954x=m
CONFIG_I2C_GPIO=m

# ===== SPI Support =====
CONFIG_SPI=y
CONFIG_SPI_MASTER=y
CONFIG_SPI_SPIDEV=m
CONFIG_SPI_GPIO=m
CONFIG_SPI_OMAP24XX=y

# ===== GPIO Support =====
CONFIG_GPIOLIB=y
CONFIG_GPIO_SYSFS=y
CONFIG_GPIO_OF_HELPER=y

# ===== PWM Support =====
CONFIG_PWM=y
CONFIG_PWM_SYSFS=y
CONFIG_PWM_TIECAP=m
CONFIG_PWM_TIEHRPWM=m
CONFIG_PWM_TIPWMSS=y

# ===== PRU (Programmable Real-Time Unit) Support =====
CONFIG_TI_PRUSS=m
CONFIG_REMOTEPROC=m
CONFIG_PRUSS_REMOTEPROC=m
CONFIG_RPMSG=m
CONFIG_RPMSG_CHAR=m

# ===== USB Gadget Support =====
CONFIG_USB_GADGET=y
CONFIG_USB_ETH=m
CONFIG_USB_ETH_RNDIS=y
CONFIG_USB_MASS_STORAGE=m
CONFIG_USB_G_SERIAL=m
CONFIG_USB_G_MULTI=m

# ===== Audio Support =====
CONFIG_SOUND=m
CONFIG_SND=m
CONFIG_SND_SOC=m
CONFIG_SND_SOC_DAVINCI_MCASP=m
CONFIG_SND_AM33XX_SOC_EVM=m

# ===== DMA Engine Support =====
CONFIG_DMADEVICES=y
CONFIG_TI_EDMA=y
CONFIG_TI_DMA_CROSSBAR=y

# ===== Watchdog Support =====
CONFIG_WATCHDOG=y
CONFIG_OMAP_WATCHDOG=m

# ===== RTC Support =====
CONFIG_RTC_CLASS=y
CONFIG_RTC_DRV_OMAP=y
CONFIG_RTC_DRV_DS1307=m

# ===== Crypto Support =====
CONFIG_CRYPTO_DEV_OMAP_AES=m
CONFIG_CRYPTO_DEV_OMAP_SHAM=m

# ===== Thermal Management =====
CONFIG_THERMAL=y
CONFIG_CPU_THERMAL=y
CONFIG_TI_SOC_THERMAL=y
CONFIG_TI_THERMAL=y

# ===== Power Management =====
CONFIG_PM=y
CONFIG_PM_DEBUG=y
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_DEFAULT_GOV_ONDEMAND=y
CONFIG_CPU_FREQ_GOV_POWERSAVE=y
CONFIG_CPU_FREQ_GOV_USERSPACE=y
CONFIG_CPU_FREQ_GOV_PERFORMANCE=y

# ===== Networking Features =====
CONFIG_PACKET=y
CONFIG_UNIX=y
CONFIG_INET=y
CONFIG_IP_MULTICAST=y
CONFIG_IP_ADVANCED_ROUTER=y
CONFIG_IP_MULTIPLE_TABLES=y
CONFIG_BRIDGE=m
CONFIG_VLAN_8021Q=m

# ===== LED Support =====
CONFIG_LEDS_CLASS=y
CONFIG_LEDS_GPIO=y
CONFIG_LEDS_TRIGGER_TIMER=y
CONFIG_LEDS_TRIGGER_HEARTBEAT=y
CONFIG_LEDS_TRIGGER_DEFAULT_ON=y

# ===== MMC/SD Support =====
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_OMAP=y
CONFIG_MMC_OMAP_HS=y

# ===== Filesystem Support =====
CONFIG_EXT4_FS=y
CONFIG_EXT4_FS_POSIX_ACL=y
CONFIG_EXT4_FS_SECURITY=y
CONFIG_OVERLAY_FS=y
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y

# ===== Security Features =====
CONFIG_SECURITY=y
CONFIG_SECURITYFS=y
CONFIG_SECURITY_NETWORK=y

# ===== Debugging Features =====
CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_FS=y
CONFIG_MAGIC_SYSRQ=y
CONFIG_DETECT_HUNG_TASK=y
