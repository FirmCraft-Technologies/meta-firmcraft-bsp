# FirmCraft BSP Layer Configuration
BBPATH .= ":${LAYERDIR}"

# Include all recipes and appends
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "firmcraft-bsp"
BBFILE_PATTERN_firmcraft-bsp := "^${LAYERDIR}/"
BBFILE_PRIORITY_firmcraft-bsp = "10"

# Layer version
LAYERVERSION_firmcraft-bsp = "2"

# Compatible with Yocto Scarthgap release
LAYERSERIES_COMPAT_firmcraft-bsp = "scarthgap"

# Layer dependencies
LAYERDEPENDS_firmcraft-bsp = " \
    core \
    openembedded-layer \
"

# Recommended layers (optional but beneficial)
LAYERRECOMMENDS_firmcraft-bsp = " \
    meta-ti \
    meta-arm \
"